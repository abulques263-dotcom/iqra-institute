name: Fix Nursery UKG fee in Hero

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Change Hero Nursery fee to 500
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/Hero.tsx')
          s = p.read_text(encoding='utf-8')
          s = s.replace('₹350 <span className="text-[10px] text-slate-500 font-normal">/mo</span>', '₹500 <span className="text-[10px] text-slate-500 font-normal">/mo</span>')
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/Hero.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update Nursery UKG fee to ₹500 in Hero"
          git push
      - name: Remove temporary workflow
        if: always()
        run: |
          git rm -f .github/workflows/fee-patch.yml || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Remove temporary fee patch workflow"
          git push
