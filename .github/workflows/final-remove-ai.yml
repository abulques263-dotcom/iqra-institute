name: Final Remove AI From Website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: final-remove-ai
  cancel-in-progress: true

jobs:
  remove-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove all visible AI tutor UI and code
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('src/components/PracticeModeModal.tsx')
          s = p.read_text(encoding='utf-8')
          s = s.replace('  Bot,\n', '')
          s = re.sub(r'\n  onOpenAiTutorWithQuestion\?: \(questionData: \{.*?\n  \}\) => void;', '', s, flags=re.S)
          s = s.replace('  onOpenAiTutorWithQuestion,\n', '')
          s = re.sub(r'\n  const handleAskAiAboutCurrent = \(\) => \{.*?\n  \};\n', '\n', s, flags=re.S)
          s = s.replace('Practice With AI & 1,000+ Question Bank', 'Practice & 1,000+ Question Bank')
          s = s.replace('Foundation questions with instant evaluation, explanations & AI tutor integration', 'Foundation questions with instant evaluation and explanations')
          s = re.sub(r'Every question comes with step-by-step conceptual reasoning\. If you get stuck, the <strong>Iqra AI Tutor</strong> will explain the solution in simple words!', 'Every question comes with step-by-step conceptual reasoning and simple explanations.', s)
          s = re.sub(r'\n                  <div className="pt-2 flex flex-wrap items-center justify-between gap-2 border-t border-stone-100">\s*<button\s+onClick=\{handleAskAiAboutCurrent\}.*?</button>\s*</div>', '', s, flags=re.S)
          s = s.replace('Review the explanations below or ask the Iqra AI Tutor to master the missed concepts.', 'Review the explanations below and practice the missed concepts.')
          p.write_text(s, encoding='utf-8')

          # Remove the complete AI API client section from the frontend API module.
          api = Path('src/api.ts')
          a = api.read_text(encoding='utf-8')
          a = re.sub(r'\n  // ----------------------------------------------------\n  // AI STUDY ASSISTANT & CHAT\n  // ----------------------------------------------------.*?\n  // News Updates', '\n  // News Updates', a, flags=re.S)
          api.write_text(a, encoding='utf-8')

          # Remove the unused AI component and server endpoints.
          for path in ['src/components/AIStudyAssistant.tsx', 'api/ai/chat.js', 'api/ai/explain-question.js', 'api/ai/generate-batch.js', 'api/ai/generate-question.js']:
            f = Path(path)
            if f.exists():
              f.unlink()

          # Remove stale AI-only comments/props from the daily question widget.
          w = Path('src/components/DailyQuestionWidget.tsx')
          if w.exists():
            ws = w.read_text(encoding='utf-8')
            ws = ws.replace('{/* Practice Mode & AI Tutor Promotion Banner */}', '{/* Practice Mode Promotion Banner */}')
            ws = ws.replace('  onAskAiTutor?: (questionText: string) => void;\n', '')
            ws = ws.replace('  onAskAiTutor,\n', '')
            w.write_text(ws, encoding='utf-8')

      - name: Verify no AI UI remains
        run: |
          if grep -RniE 'Iqra AI|AI Tutor|AI Study Assistant|Ask Iqra AI|Practice With AI|AI tutor integration' src --include='*.tsx' --include='*.ts'; then
            echo 'AI UI/code still found in frontend source.'
            exit 1
          fi

      - name: Build
        run: |
          npm install
          VITE_BASE_PATH=/iqra-institute/ npm run build

      - name: Commit final removal
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Completely remove AI tutor from website'
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
