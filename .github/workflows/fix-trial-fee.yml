name: Fix Nursery UKG Trial Fee

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update Nursery UKG fee in trial form
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/TrialAdmissionSection.tsx')
          s = p.read_text(encoding='utf-8')
          old = '<option value="Nursery – UKG">Nursery – UKG (₹350/mo)</option>'
          new = '<option value="Nursery – UKG">Nursery – UKG (₹500/mo)</option>'
          if old not in s:
              raise SystemExit('Expected old Nursery UKG fee text was not found')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY

      - name: Commit fee correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/TrialAdmissionSection.tsx
          git commit -m "Update Nursery UKG trial form fee to ₹500"
          git push

      - name: Remove temporary workflow
        if: always()
        run: |
          git rm -f .github/workflows/fix-trial-fee.yml || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Remove temporary trial fee fix workflow"
          git push
