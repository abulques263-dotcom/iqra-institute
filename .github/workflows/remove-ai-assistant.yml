name: Verify AI removal

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/remove-ai-assistant.yml'
      - 'src/**'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify website build
        run: |
          npm install
          npm run build
      - name: Check for broken AI UI references
        run: |
          ! grep -R "AIStudyAssistant\|Iqra AI Tutor\|#ai-tutor" src/App.tsx src/components/Navbar.tsx
